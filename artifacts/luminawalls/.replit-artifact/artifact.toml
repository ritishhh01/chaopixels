kind = "web"
previewPath = "/"
title = "LuminaWalls"
version = "1.0.0"
id = "artifacts/luminawalls"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21564

[services.development]
run = "pnpm --filter @workspace/luminawalls run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luminawalls", "run", "build" ]
publicDir = "artifacts/luminawalls/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21564"
BASE_PATH = "/"
